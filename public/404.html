<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // HashRouter deep-link recovery.
      // Pages serves 404.html for any path that isn't a built file.
      // Rewrite /TheFulcrumMemo/<path> -> /TheFulcrumMemo/#/<path> so
      // old BrowserRouter-style URLs (e.g. /TheFulcrumMemo/my-business)
      // and typos still land on the correct route.
      (function () {
        var base = '/TheFulcrumMemo/';
        var l = window.location;
        // Strip the base, if present.
        var pathAfterBase = l.pathname.indexOf(base) === 0
          ? l.pathname.slice(base.length)
          : l.pathname.replace(/^\//, '');
        // If someone hit the root (shouldn't 404, but just in case), go home.
        if (!pathAfterBase) {
          l.replace(base);
          return;
        }
        // Preserve query + any existing hash the browser kept.
        var hash = l.hash && l.hash !== '#' ? l.hash.replace(/^#\/?/, '') : '';
        var target = base + '#/' + pathAfterBase.replace(/^\/+/, '') +
          (l.search || '') +
          (hash ? (l.search ? '&' : '') : '');
        l.replace(target);
      })();
    </script>
  </head>
  <body>
    If you aren't redirected automatically,
    <a href="/TheFulcrumMemo/">return to The Fulcrum Memo</a>.
  </body>
</html>
