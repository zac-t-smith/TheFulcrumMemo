<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // HashRouter deep-link recovery.
      // Pages serves 404.html for any path that isn't a built file.
      // Rewrite /<path> -> /#/<path> so direct URLs like /join, /falcon,
      // /memos/kirklands, and anything a user types / pastes still land
      // on the correct route under HashRouter.
      (function () {
        var base = '/';
        var l = window.location;
        var pathAfterBase = l.pathname.replace(/^\/+/, '');
        if (!pathAfterBase) {
          l.replace(base);
          return;
        }
        // Preserve the existing search string; drop any stray hash — the
        // 404 can't have arrived with a meaningful one.
        l.replace(base + '#/' + pathAfterBase + (l.search || ''));
      })();
    </script>
  </head>
  <body>
    If you aren't redirected automatically,
    <a href="/">return to The Fulcrum Memo</a>.
  </body>
</html>
