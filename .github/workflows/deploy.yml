name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Build once so vite preview has something to serve for the PDF renderer.
      - name: Initial build
        run: npm run build
        env:
          VITE_AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          VITE_FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VITE_EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render memo PDFs
        run: npm run render:pdfs

      - name: Confirm PDFs were written
        run: |
          echo "--- public/pdfs/ ---"
          ls -lh public/pdfs/
          test -s public/pdfs/Fulcrum-Memo_Kirklands.pdf

      # Rebuild so the just-rendered public/pdfs/*.pdf land inside dist/.
      - name: Rebuild with PDFs bundled
        run: npm run build
        env:
          VITE_AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          VITE_FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VITE_EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Confirm PDFs made it into dist/
        run: |
          echo "--- dist/pdfs/ ---"
          ls -lh dist/pdfs/ || echo "dist/pdfs/ does not exist!"
          test -s dist/pdfs/Fulcrum-Memo_Kirklands.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
