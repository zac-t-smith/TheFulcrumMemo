name: Fit Cycle Probability Model

# Phase 2B — refits the Fulcrum v5 Cycle Probability (12-month) logistic
# regression. Monthly cadence is sufficient: EBP is monthly, SLOOS is
# quarterly, and the walk-forward backtest's answer barely moves day-to-day.
#
# The job is self-contained: it pulls fresh FRED + EBP data first, then
# fits, then commits src/data/cycleModel.json. Daily data updates still
# happen in update-fulcrum-data.yml; this workflow does not replace it.
on:
  schedule:
    # 10:00 UTC on the 5th of every month (gives the Fed's EBP post, which
    # arrives on the 4th business day, a full day of settle time).
    - cron: "0 10 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            quant/requirements.txt
            quant/requirements-model.txt

      - name: Install pipeline deps (FRED + EBP fetchers)
        working-directory: quant
        run: pip install -r requirements.txt

      - name: Install model deps (numpy / sklearn / statsmodels)
        working-directory: quant
        run: pip install -r requirements-model.txt

      # Pull fresh data so the fit sees the latest observations even if
      # the daily job hasn't run yet. Mirrors update-fulcrum-data.yml's
      # partial-failure contract.
      - name: Pull FRED data
        working-directory: quant
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.VITE_FRED_API_KEY }}
        run: |
          python scripts/fetch_fred_data.py \
            --ts-dir ../src/data \
            --data-dir data \
            --summary-out fred_pull_summary.json

      - name: Pull EBP data
        working-directory: quant
        run: |
          python scripts/fetch_ebp.py \
            --ts-dir ../src/data \
            --data-dir data \
            --summary-out ebp_pull_summary.json

      - name: Fit cycle probability model
        working-directory: ${{ github.workspace }}
        run: |
          python quant/scripts/fit_cycle_probability.py \
            --data-dir quant/data \
            --out src/data/cycleModel.json

      - name: Show primary target + AUC
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          m = json.load(open("src/data/cycleModel.json"))
          t = m["primary_target"]
          print("primary target:", t)
          for name, r in m["backtest"][t]["feature_sets"].items():
              print(f"  {name:28s} AUC={r.get('auc')}  n_oos={r.get('n_oos')}  base_rate={r.get('base_rate')}")
          snap = m["latest_snapshot"]
          print("current:", snap["date"], "p =", snap["probability"],
                "band", [snap["band_5pct"], snap["band_95pct"]],
                "base rate", snap["base_rate_primary_target"])
          PY

      - name: Check for changes
        id: git_check
        run: |
          if [[ -n "$(git status --porcelain quant/data/ src/data/)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git status --porcelain quant/data/ src/data/
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit model + any refreshed data
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config user.name "fulcrum-data-bot"
          git config user.email "fulcrum-data-bot@users.noreply.github.com"
          git add quant/data/ src/data/
          git commit -m "model: cycle probability refit $(date -u +%Y-%m-%d)

          Auto-generated by .github/workflows/fit-cycle-model.yml.

          See src/data/cycleModel.json for coefficients, bootstrap draws,
          and the walk-forward backtest table."
          git push

      - name: Upload fit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cycle-model-fit-${{ github.run_id }}
          path: |
            src/data/cycleModel.json
            quant/fred_pull_summary.json
            quant/ebp_pull_summary.json
          retention-days: 90
          if-no-files-found: warn
